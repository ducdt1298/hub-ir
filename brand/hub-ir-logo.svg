<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 256" width="720" height="256" role="img" aria-label="HubIR">
  <title>HubIR</title>
  <!--
    The wordmark: the emitter, then the name, on the same navy panel as the
    icon. Carrying the background across the whole thing is deliberate — Home
    Assistant shows this on a card that is white in one theme and near-black in
    the other, and dark lettering on a transparent background disappears in the
    second. A panel reads the same in both.

    "IR" takes the accent colour so the two halves of the name separate at a
    glance. scripts/build_brand.py renders the PNGs the brands repository wants
    from this file; the text is a system stack because the raster is what ships.
  -->
  <defs>
    <linearGradient id="wave" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="1" stop-color="#FFB627"/>
    </linearGradient>
  </defs>

  <rect width="720" height="256" rx="56" fill="#14243A"/>

  <g fill="none" stroke="url(#wave)" stroke-linecap="round">
    <path d="M68 136 A 52 52 0 0 1 120 188" stroke-width="17"/>
    <path d="M68 92  A 96 96 0 0 1 164 188" stroke-width="16" opacity=".82"/>
    <path d="M68 48  A 140 140 0 0 1 208 188" stroke-width="15" opacity=".58"/>
  </g>

  <circle cx="68" cy="188" r="19" fill="url(#wave)"/>

  <text x="272" y="132" dominant-baseline="central"
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
        font-size="104" font-weight="700" letter-spacing="-2">
    <tspan fill="#FFFFFF">Hub</tspan><tspan fill="url(#wave)">IR</tspan>
  </text>
</svg>
